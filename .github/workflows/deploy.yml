name: Fabric Dev to Test Deployment New
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------
      # 1. GET AZURE AD TOKEN
      # ------------------------------------
      - name: Get Azure AD Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CLIENT_SECRET }}" \
            -d "scope=https://analysis.windows.net/powerbi/api/.default" \
            -d "grant_type=client_credentials" \
            | jq -r .access_token)
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT

      # ------------------------------------
      # 2. SYNC GIT → DEV WORKSPACE
      # ------------------------------------
      - name: Sync Git to Dev Workspace
        run: |
          echo "Syncing Git to Dev workspace..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"workspaceHead\": null,
              \"remoteCommitHash\": null,
              \"conflictResolution\": {
                \"conflictResolutionType\": \"Workspace\",
                \"conflictResolutionPolicy\": \"PreferRemote\"
              },
              \"options\": {
                \"allowOverrideItems\": true
              }
            }")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Body: $BODY"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "❌ Git sync failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Git sync triggered, waiting 30s for it to complete..."
          sleep 60

      # ------------------------------------
      # 3. GET PIPELINE STAGES (DYNAMIC)
      # ------------------------------------
      - name: Get Deployment Pipeline Stages
        id: stages
        run: |
          RESPONSE=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/deploymentPipelines/${{ secrets.FABRIC_PIPELINE_ID }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}")
          echo "Pipeline definition:"
          echo "$RESPONSE"
          DEV_ID=$(echo "$RESPONSE" | jq -r '.stages[] | select(.displayName=="Development") | .id')
          TEST_ID=$(echo "$RESPONSE" | jq -r '.stages[] | select(.displayName=="Test") | .id')

          echo "Dev stage ID: $DEV_ID"
          echo "Test stage ID: $TEST_ID"

          if [ -z "$DEV_ID" ] || [ "$DEV_ID" = "null" ]; then
            echo "❌ Dev stage not found — check displayName matches exactly in Fabric"
            exit 1
          fi

          if [ -z "$TEST_ID" ] || [ "$TEST_ID" = "null" ]; then
            echo "❌ Test stage not found — check displayName matches exactly in Fabric"
            exit 1
          fi

          echo "✅ Stages found"
          echo "dev_stage_id=$DEV_ID" >> $GITHUB_OUTPUT
          echo "test_stage_id=$TEST_ID" >> $GITHUB_OUTPUT

      # ------------------------------------
      # 4. TRIGGER DEPLOYMENT (DEV → TEST)
      # ------------------------------------
      - name: Trigger Fabric Deployment Pipeline
        run: |
          echo "Triggering Dev → Test deployment..."

          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.fabric.microsoft.com/v1/deploymentPipelines/${{ secrets.FABRIC_PIPELINE_ID }}/deploy" \
              -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"sourceStageId\": \"${{ steps.stages.outputs.dev_stage_id }}\",
                \"targetStageId\": \"${{ steps.stages.outputs.test_stage_id }}\"
              }")

            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "HTTP Status: $HTTP_STATUS"
            echo "Body: $BODY"

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ]; then
              echo "✅ Deployment triggered successfully"
              exit 0
            fi

            ERROR_CODE=$(echo "$BODY" | jq -r '.errorCode')

            if [ "$ERROR_CODE" = "WorkspaceMigrationOperationInProgress" ]; then
              echo "⏳ Migration in progress, waiting 60s before retry..."
              sleep 60
            else
              echo "❌ Deployment failed: $ERROR_CODE"
              exit 1
            fi
          done

          echo "❌ Deployment failed after 5 attempts"
          exit 1
