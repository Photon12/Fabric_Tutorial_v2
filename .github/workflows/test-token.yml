name: Fabric Dev to Test Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dev-to-test:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # STEP 1: GET ACCESS TOKEN
      # ----------------------------
      - name: Get Azure AD Token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${{ secrets.TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CLIENT_SECRET }}" \
            -d "scope=https://analysis.windows.net/powerbi/api/.default" \
            -d "grant_type=client_credentials" \
            | jq -r .access_token)

          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT


      # ----------------------------
      # STEP 2: TRIGGER DEPLOYMENT PIPELINE
      # ----------------------------
      - name: Trigger Fabric Deployment Pipeline (Dev → Test)
        run: |
          echo "Triggering Fabric Deployment Pipeline..."

          RESPONSE=$(curl -s -X POST \
            "https://api.fabric.microsoft.com/v1/deploymentPipelines/${{ secrets.FABRIC_PIPELINE_ID }}/deploy" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sourceStage": "Development",
              "targetStage": "Test"
            }')

          echo "Response:"
          echo "$RESPONSE"

          echo "Deployment trigger completed"
